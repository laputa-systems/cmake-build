name: whole-change mutation trial

on: pull_request

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  plan:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      modules: ${{ steps.select.outputs.modules }}
      buildlib: ${{ steps.buildlib.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: buildlib
        run: |
          revision=$(cat .github/mutation-buildlib-revision)
          [[ $revision =~ ^[a-f0-9]{40}$ ]]
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: laputa-systems/buildlib
          ref: ${{ steps.buildlib.outputs.revision }}
          path: .work/buildlib
          persist-credentials: false
      - id: select
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
        run: |
          modules=$(python3 .github/scripts/select_mutation_sources.py "$BASE_REVISION" .work/buildlib/scripts \
            --qualified-modules .github/mutation-dispositions.toml)
          printf 'Selected modules: %s\n' "$modules"
          printf 'modules=%s\n' "$modules" >> "$GITHUB_OUTPUT"
  controller:
    needs: plan
    if: needs.plan.outputs.modules != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.plan.outputs.modules) }}
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    env:
      MODULE: ${{ matrix.module }}
      BASE_REVISION: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: laputa-systems/buildlib
          ref: ${{ needs.plan.outputs.buildlib }}
          path: .work/buildlib
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: 0.13.7
      - run: uv python install 3.15.2
      - name: Verify mutation results
        run: |
          make mutants-diff MUTATION_BASE="$BASE_REVISION" MUTATION_SCOPE="$MODULE" MUTATION_BUILDLIB=.work/buildlib

  whole-change:
    if: always()
    needs: [plan, controller]
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 3
    env:
      PLAN: ${{ needs.plan.result }}
      CONTROLLER: ${{ needs.controller.result }}
      MODULES: ${{ needs.plan.outputs.modules }}
    steps:
      - run: |
          test "$PLAN" = success
          if [ "$MODULES" = '[]' ]; then
            test "$CONTROLLER" = skipped
          else
            test "$CONTROLLER" = success
          fi
