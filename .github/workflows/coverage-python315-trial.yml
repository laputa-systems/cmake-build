name: sealed branch coverage trial

on: pull_request

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  coverage:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-setup
        with:
          target: x86_64-unknown-linux-musl
          jaq: jaq-x86_64
          kache: kache-x86_64-unknown-linux-musl
      - name: Prepare audited native build
        run: TMPDIR="$PWD/.work/tmp" python3 build.py build --target x86_64-unknown-linux-musl --qualification-build
      - name: Run the retained coverage entry point
        run: |
          make coverage TARGET=x86_64-unknown-linux-musl
          jaq '.totals | {covered_lines, num_statements, covered_branches, num_branches}' \
            .work/coverage/controller-x86_64-unknown-linux-musl.json
