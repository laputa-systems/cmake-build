name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  controller:
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-setup
        with:
          target: x86_64-unknown-linux-musl
          jaq: jaq-x86_64
          kache: kache-x86_64-unknown-linux-musl
      - name: Prepare audited native build
        run: |
          export TMPDIR="$PWD/.work/tmp"
          python3 build.py build --target x86_64-unknown-linux-musl --qualification-build
      - name: Run controller suite in the native builder
        run: make test-ci
