name: qualify
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    name: qualify ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-26.04
            jaq: jaq-x86_64
            kache: kache-x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-26.04-arm
            jaq: jaq-aarch64
            kache: kache-aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-setup
        with:
          target: ${{ matrix.target }}
          jaq: ${{ matrix.jaq }}
          kache: ${{ matrix.kache }}
      - name: Qualify the exact packaged archive
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          export TMPDIR="$PWD/.work/tmp"
          python3 build.py qualify --target "$TARGET"
      - name: Check native memory against the committed baseline
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          export TMPDIR="$PWD/.work/tmp"
          jaq -e --arg target "$TARGET" '.targets[$target].memory_status == "measured"' release-budgets.json > /dev/null
          python3 build.py benchmark --target "$TARGET"
      - name: Verify and stage qualification evidence
        env:
          TARGET: ${{ matrix.target }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          candidate=".work/artifacts/$TARGET/candidate.json"
          archive_name=$(jaq -r '.archive' "$candidate")
          test "$archive_name" = "cmake-4.4.5-$TARGET.tar.xz"
          archive=".work/artifacts/$TARGET/$archive_name"
          sha=$(sha256sum "$archive" | cut -d' ' -f1)
          size=$(stat -c '%s' "$archive")
          jaq -e --arg name "$archive_name" --arg sha "$sha" --arg commit "$SOURCE_SHA" --argjson size "$size" '.archive == $name and .sha256 == $sha and .size == $size and .commit == $commit' "$candidate" >/dev/null
          generation=".work/generations/$TARGET/$sha"
          test "$(sha256sum "$generation/artifact.tar.xz" | cut -d' ' -f1)" = "$sha"
          jaq -e --arg sha "$sha" --argjson size "$size" '.archive_sha256 == $sha and .archive_size == $size and .qualification.basic == "passed" and .qualification.parity == "passed" and .qualification.network == "passed" and .qualification.projects == "passed" and (.qualification.upstream | type == "string" and length > 0)' "$generation/results.json" >/dev/null
          budget_sha=$(sha256sum release-budgets.json | cut -d' ' -f1)
          rss_scope=$(python3 -c 'from buildsys.budgets import RSS_SCOPE; print(RSS_SCOPE)')
          memory=".work/benchmark-results/$TARGET.json"
          jaq -e --arg sha "$sha" --arg target "$TARGET" --arg budget "$budget_sha" --arg scope "$rss_scope" --argjson size "$size" '.target == $target and .archive_sha256 == $sha and .archive_size == $size and .budget_sha256 == $budget and .rss_scope == $scope and .repetitions >= 5 and .result == "passed" and (.measurements | keys == ["fmt_initial_rss_kib", "libjpeg-turbo_initial_rss_kib", "llvm-clang_initial_rss_kib", "zstd_initial_rss_kib"] and all(.[]; type == "number" and . > 0))' "$memory" >/dev/null
          python3 -c 'from pathlib import Path; from buildsys.package import inspect; import sys; inspect(Path(sys.argv[1]))' "$archive"
          destination=".work/release/$TARGET"
          mkdir -p "$destination"
          tar -xOf "$archive" usr/share/doc/cmake-build/artifact.json > "$destination/artifact-$TARGET.json"
          jaq -e --arg sha "$SOURCE_SHA" --arg target "$TARGET" '.source.commit == $sha and .target.triple == $target and .build.mode == "qualification" and .build.network == "none" and .build.network_probe == "passed"' "$destination/artifact-$TARGET.json" >/dev/null
          cp "$archive" "$destination/"
          cp "$generation/results.json" "$destination/results-$TARGET.json"
          cp "$memory" "$destination/memory-$TARGET.json"
          cp docs/performance.md "$destination/performance-$TARGET.md"
          cp docs/qualification.md "$destination/qualification-$TARGET.md"
          (cd "$destination" && LC_ALL=C sha256sum -- * > "SHA256SUMS-$TARGET.txt")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cmake-prerelease-${{ matrix.target }}
          path: .work/release/${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: rejected-benchmark-${{ matrix.target }}
          path: .work/tmp/benchmark-rejected.md
          if-no-files-found: ignore
