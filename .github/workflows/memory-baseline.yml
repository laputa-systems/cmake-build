name: Native memory baseline
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  baseline:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            jaq: jaq-x86_64
            kache: kache-x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            jaq: jaq-aarch64
            kache: kache-aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/native-setup
        with:
          target: ${{ matrix.target }}
          jaq: ${{ matrix.jaq }}
          kache: ${{ matrix.kache }}
      - name: Restore the qualified baseline
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          command -v strace
          image=$(python3 -c 'from pathlib import Path; from buildsys import sandbox; from buildsys.inputs import load_bootstrap; from buildsys.targets import target; import sys; p=Path.cwd(); print(sandbox.image_tag(load_bootstrap(p/"bootstrap.lock.json"), target(sys.argv[1]), p/"docker/builder.Dockerfile"))' "$TARGET")
          docker run --rm --network none -v "$PWD:/src:ro" -v "$PWD/.work/tmp:/src/.work/tmp:rw" -w /src -e TMPDIR=/src/.work/tmp -e PYTHONDONTWRITEBYTECODE=1 "$image" python3 build.py controller-test -k benchmark_process
          gh run view 42828105487 --json headSha,conclusion > .work/run.json
          jaq -e '.headSha == "58313acce6f94f216eeeaf4ff2d9ec274b201485" and .conclusion == "success"' .work/run.json > /dev/null
          gh run download 42828105487 --name "cmake-prerelease-$TARGET" --dir .work/tmp/baseline
          archive=".work/tmp/baseline/cmake-4.4.5-$TARGET.tar.xz"
          results=".work/tmp/baseline/results-$TARGET.json"
          sha=$(jaq -r --arg target "$TARGET" '.targets[$target].archive_sha256' release-budgets.json)
          size=$(jaq -r --arg target "$TARGET" '.targets[$target].memory_archive_bytes' release-budgets.json)
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = "$sha"
          test "$(stat -c '%s' "$archive")" = "$size"
          jaq -e --arg sha "$sha" --argjson size "$size" '.archive_sha256 == $sha and .archive_size == $size and .qualification.basic == "passed" and .qualification.parity == "passed" and .qualification.network == "passed" and .qualification.projects == "passed" and (.qualification.upstream | type == "string" and length > 0)' "$results" > /dev/null
          generation=".work/generations/$TARGET/$sha"
          mkdir -p "$generation"
          cp "$archive" "$generation/artifact.tar.xz"
          cp "$results" "$generation/results.json"
          python3 -c 'from pathlib import Path; from buildsys.inputs import safe_extract; from buildsys.package import inspect; import sys; p = Path(sys.argv[1]); metadata = inspect(p / "artifact.tar.xz"); (metadata["source"]["commit"] == "58313acce6f94f216eeeaf4ff2d9ec274b201485" and metadata["target"]["triple"] == sys.argv[2] and metadata["build"]["mode"] == "qualification") or sys.exit("baseline metadata does not match"); safe_extract(p / "artifact.tar.xz", p / "tree")' "$generation" "$TARGET"
          ln -s "$sha/tree" ".work/generations/$TARGET/active"
      - name: Build the unmodified reference and measure five repetitions
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          export TMPDIR="$PWD/.work/tmp"
          python3 build.py test --target "$TARGET" --suite upstream
          old_sizes=$(git show 96080878936ec2f79d8b17ee888d8d66cf6563cc:release-budgets.json | jaq -c --arg target "$TARGET" '.targets[$target].metrics | {archive_bytes, executable_bytes, unpacked_bytes}')
          jaq --arg target "$TARGET" --argjson sizes "$old_sizes" '.targets[$target].metrics += $sizes' release-budgets.json > .work/tmp/baseline-budgets.json
          mv .work/tmp/baseline-budgets.json release-budgets.json
          python3 build.py benchmark --target "$TARGET"
          scope=$(python3 -c 'from buildsys.budgets import RSS_SCOPE; print(RSS_SCOPE)')
          jaq -e --arg target "$TARGET" --arg scope "$scope" '.targets[$target].memory_status == "measured" and .targets[$target].rss_scope == $scope and .targets[$target].memory_repetitions == 5' release-budgets.json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: memory-baseline-${{ matrix.target }}
          path: |
            release-budgets.json
            docs/performance.md
          if-no-files-found: error
