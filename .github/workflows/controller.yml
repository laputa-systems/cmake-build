name: controller
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  controller:
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-setup
        with:
          target: x86_64-unknown-linux-musl
          jaq: jaq-x86_64
          kache: kache-x86_64-unknown-linux-musl
      - name: Prepare audited native build
        run: |
          export TMPDIR="$PWD/.work/tmp"
          python3 build.py build --target x86_64-unknown-linux-musl --qualification-build
      - name: Run controller suite in the native builder
        run: |
          export TMPDIR="$PWD/.work/tmp"
          python3 -c 'import sys; from pathlib import Path; import build; target=build.describe_target("x86_64-unknown-linux-musl"); image=build.sandbox.image_tag(build.load_bootstrap(build.BOOTSTRAP_LOCK),target,build.DOCKERFILE); r=build.sandbox.run_sealed(image,["python3","build.py","controller-test"],target=target,mounts=[(Path.cwd(),"/src")],env={"TMPDIR":"/src/.work/tmp","PYTHONPATH":"/src","PATH":"/src/.work/tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"},timeout=300); print(r.stdout,end=""); print(r.stderr,end="",file=sys.stderr); sys.exit(r.returncode)'
