[project]
name = "cmake-build"
version = "0.0.0"
description = "Reproducible relocatable CMake distribution for musl Linux"
requires-python = ">=3.15"
dependencies = ["laputa-buildlib==0.1.0"]

[dependency-groups]
dev = [
    "ruff==0.17.4",
    "ty==0.0.101",
    "uv==0.13.7",
]

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
package = false

[tool.ruff]
target-version = "py315"
extend-exclude = [".work"]

[tool.ty.environment]
python-version = "3.15"
python-platform = "linux"

[[tool.uv.index]]
url = "https://pypi.17166969.xyz/current/simple/"
default = true
